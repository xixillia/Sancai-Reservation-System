basePath: /api
definitions:
  structs.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  structs.Table:
    properties:
      capacity:
        type: integer
      id:
        type: integer
      status:
        type: string
      table_number:
        type: string
    type: object
  structs.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
host: sancai-reservation-system-production.up.railway.app
info:
  contact: {}
  description: API restoran
  title: Sancai API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Login pakai email dan password
      parameters:
      - description: Login input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/structs.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - User
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan user baru ke sistem dengan name, email, password,
        dan role
      parameters:
      - description: Data User Baru
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/structs.User'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "user registered"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '{"error": "Invalid email format / Email already exists"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: '{"error": "could not create user"}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - User
  /tables:
    get:
      description: Mengambil daftar lengkap meja beserta statusnya
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/structs.Table'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ambil semua meja
      tags:
      - Tables
    post:
      consumes:
      - application/json
      description: Menambahkan meja ke sistem (Admin Only)
      parameters:
      - description: Data Meja
        in: body
        name: table
        required: true
        schema:
          $ref: '#/definitions/structs.Table'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.Table'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tambah meja baru
      tags:
      - Tables
  /tables/{id}:
    delete:
      description: Menghapus meja jika tidak ada reservasi aktif di masa depan
      parameters:
      - description: Table ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hapus meja
      tags:
      - Tables
    get:
      description: Mengambil data detail satu meja menggunakan parameter ID
      parameters:
      - description: Table ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.Table'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ambil meja berdasarkan ID
      tags:
      - Tables
    put:
      consumes:
      - application/json
      description: Mengubah nomor meja, kapasitas, atau status
      parameters:
      - description: Table ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Data Meja
        in: body
        name: table
        required: true
        schema:
          $ref: '#/definitions/structs.Table'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update info meja
      tags:
      - Tables
  /tables/{id}/status:
    patch:
      consumes:
      - application/json
      description: Mengubah status (available/reserved/occupied) secara spesifik
      parameters:
      - description: Table ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status Baru (Cukup isi field status)
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/structs.Table'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update status meja
      tags:
      - Tables
  /tables/available:
    get:
      description: Mencari meja berdasarkan jumlah tamu dan waktu tertentu yang tidak
        bentrok dengan reservasi lain
      parameters:
      - description: 'Format: YYYY-MM-DD HH:MM:SS'
        example: '"2026-02-20 19:00:00"'
        in: query
        name: datetime
        required: true
        type: string
      - description: Jumlah tamu
        example: 4
        in: query
        name: guests
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/structs.Table'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cari meja tersedia
      tags:
      - Tables
securityDefinitions:
  BearerAuth:
    description: 'Ketik: "Bearer [spasi] token_anda"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
